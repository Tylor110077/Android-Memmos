<style>
/* ============ 页面骨架 ============ */

body{background:#05060a;color:#eef1f7;font-family:"Sora","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;padding:48px 40px 80px}
.dir-head{max-width:1200px;margin-bottom:36px}

.sw{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.14);position:relative}

.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#101218}

/* ============ 小红书宿主场景 ============ */

.xhs-top{display:flex;align-items:center;justify-content:center;gap:22px;padding:20px 18px 12px;font-size:15px;color:rgba(255,255,255,.55);position:relative}

.xhs-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 12px 12px;align-content:start;overflow:hidden}

.g1{background:linear-gradient(135deg,#3b2a52,#8d5a8f)}.g2{background:linear-gradient(135deg,#14343b,#3f8e7f)}

/* ============ 图标 ============ */
.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.cover{height:148px;position:relative}

.card-body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:10px}

.sect-label{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.42);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.cta{margin-top:auto;height:48px;border-radius:16px;background:linear-gradient(135deg,#ff2e4d,#ff7a45);display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:700;color:#fff;box-shadow:0 10px 26px rgba(255,46,77,.35);letter-spacing:.03em}

.dest code{color:rgba(255,178,153,.8);background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px}

/* 语音态 */
.rec-card{background:rgba(255,46,77,.1);border:1px solid rgba(255,46,77,.45);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.wave{display:flex;align-items:center;gap:3px;height:38px}
.wave i{flex:1;background:linear-gradient(to top,#ff2e4d,#ff7a45);border-radius:3px;animation:wv 1s ease-in-out infinite}

.rec-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.65)}

.rec-meta .rec i{width:8px;height:8px;border-radius:50%;background:#ff2e4d;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.transcript{font-size:12px;line-height:1.7;color:rgba(255,255,255,.55);font-style:italic;border-top:1px dashed rgba(255,255,255,.14);padding-top:10px}
.transcript b{color:#ffd7dc;font-style:normal;font-weight:600}

/* 进度 */
.prog{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:11px;font-size:12.5px;color:rgba(255,255,255,.85)}
.prow .ic{width:32px;height:32px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
.prow .ok{color:#7ee2a8}
.bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff2e4d,#ff7a45);position:relative}
.bar.run i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shm 1.2s linear infinite}
@keyframes shm{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prow .val{font-size:11px;color:rgba(255,255,255,.5);min-width:58px;text-align:right}
.done-block{background:rgba(70,200,130,.09);border:1px solid rgba(70,200,130,.35);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:9px}
.done-top{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:#8ff0b4}
.path-chip{font-size:10.5px;color:rgba(255,214,170,.85);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 9px;line-height:1.5}
.recent{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:8px 10px}
.rrow .th{width:34px;height:34px;border-radius:9px}
.rrow .ti{font-size:12px;color:rgba(255,255,255,.85);line-height:1.35}
.rrow .tm{margin-left:auto;font-size:10px;color:rgba(255,255,255,.35)}
.divider-cap{display:flex;align-items:center;gap:10px;font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.2em}
.divider-cap::before,.divider-cap::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}

.sheet{position:absolute;left:0;right:0;bottom:0;height:82%;border-radius:26px 26px 0 0;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  background:linear-gradient(190deg,rgba(30,33,43,.94),rgba(15,17,23,.97));border-top:1px solid rgba(255,255,255,.12);

.sheet-grab{width:38px;height:4.5px;border-radius:99px;background:rgba(255,255,255,.25);margin:0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head b{font-size:16.5px}
.sheet-head .fin{font-size:13px;color:#ff8b98;font-weight:600}
.f-label{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.45)}
.pos-widget{display:flex;gap:14px;align-items:center}
.phone-outline{width:74px;height:128px;border:1.5px solid rgba(255,255,255,.28);border-radius:14px;position:relative;flex:0 0 auto}
.poz{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:8px;color:rgba(255,255,255,.4);font-size:9px}
.poz.l{left:-7px;top:34%;bottom:34%;width:14px}.poz.r{right:-7px;top:34%;bottom:34%;width:14px}

.srow{display:flex;align-items:center;gap:12px;font-size:12.5px;color:rgba(255,255,255,.8)}

<body>

<header class="dir-head">
  <span class="dir-tag">DIRECTION A</span>
  <h1>琉璃 Glass</h1>
  <p>深色玻璃拟态：半透明磨砂层浮在宿主内容之上，小红书红橙渐变作为唯一强调色。
    定位是「轻巧的捕捉器」——待机时低存在感呼吸微光，触发后面板像一块浮起的玻璃，与任何被覆盖的 App 都不打架。</p>
  <div class="swatches">
    <div class="sw" style="background:linear-gradient(135deg,#ff2e4d,#ff7a45)"><span>强调渐变</span></div>
    <div class="sw" style="background:#14161d"><span>玻璃底</span></div>
    <div class="sw" style="background:rgba(255,255,255,.14)"><span>描边高光</span></div>
    <div class="sw" style="background:#46c882"><span>配对在线</span></div>
  </div>
</header>

<div class="frames">

<!-- ═══════════ 场景1 待机 ═══════════ -->
<figure class="frame">
  <div class="phone"><div class="screen">
    <div class="xhs">
      <div class="xhs-top"><span>关注</span><b>发现</b><span>附近</span><svg class="i x-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
      <div class="xhs-grid">
        <div class="xcard"><div class="xcover g1"></div><div class="xt">独居一年，我把出租屋改成了样子</div><div class="xm"><i class="av g5"></i>阿绵 · 赞 3.2万</div></div>
        <div class="xcard"><div class="xcover play g2"></div><div class="xt">一个人自律的100天，我悟了</div><div class="xm"><i class="av g4"></i>山野拾光 · 赞 1.2万</div></div>
        <div class="xcard"><div class="xcover g3"></div><div class="xt">手冲入门｜三支豆子横评</div><div class="xm"><i class="av g6"></i>豆贩子 · 赞 8941</div></div>
        <div class="xcard"><div class="xcover play g4"></div><div class="xt">通勤背包开箱，能装下整个生活</div><div class="xm"><i class="av g1"></i>Kiko · 赞 6720</div></div>
      </div>
      <div class="xhs-nav">
        <span class="nav-i">首页</span><span class="nav-i">市集</span><span class="fab">+</span><span class="nav-i">消息</span><span class="nav-i">我</span>
      </div>
    </div>
    <div class="tab"><span class="logo"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div></div>
